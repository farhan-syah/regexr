# Tag gate for a releasable build. Pushing a v* tag validates the tag and runs
# the full test suite. Nothing is published and nothing leaves the repo.
#
# Publishing is the separate, manually dispatched `Release` workflow. That split
# is the point: a tag push no longer sends anything to crates.io on its own, and
# an irreversible publish needs a human to ask for it after seeing this run go
# green. A crates.io version can never be unpublished — only yanked — so an
# accidental tag must not be able to burn one.

name: Release Prepare
run-name: Release Prepare ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-prepare-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-version:
    uses: ./.github/workflows/release-validate.yml
    with:
      ref: ${{ github.ref_name }}

  # Full lint + cross-platform test + feature/JIT/MSRV/audit gates. Calls
  # test.yml directly rather than ci.yml, whose PR-draft gate skips under
  # workflow_call.
  ci:
    name: CI Gate
    needs: validate-version
    uses: ./.github/workflows/test.yml

  summary:
    name: Release instructions
    needs: [validate-version, ci]
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Prepared v${VERSION}"
            echo
            echo "The tag validates, the changelog section exists, and the full"
            echo "suite passed. Publish with:"
            echo
            echo '```sh'
            echo "gh workflow run release.yml -R ${REPO} -f tag=v${VERSION}"
            echo '```'
            echo
            echo "If one stage fails, re-run the same command with only the"
            echo "remaining stage enabled (e.g. \`-f publish_crate=false\`)."
          } >> "$GITHUB_STEP_SUMMARY"
