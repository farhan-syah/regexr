[package]
name = "regexr"
version = "0.1.3"
edition = "2021"
authors = ["Farhan Syah"]
description = "A high-performance regex engine built from scratch with JIT compilation and SIMD acceleration"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ml-rust/regexr"
keywords = ["regex", "jit", "simd", "pattern-matching"]
categories = ["text-processing", "parsing"]

[features]
default = ["simd"]
jit = ["dynasm", "dynasmrt"]
simd = []
full = ["jit", "simd"]

[dependencies]
dynasm = { version = "5.0", optional = true }
dynasmrt = { version = "5.0", optional = true }
memchr = "2"
aho-corasick = "1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
regex = "1"
fancy-regex = "0.18"
pcre2 = "0.2"
aho-corasick = "1"

[[bench]]
name = "competitors"
harness = false
