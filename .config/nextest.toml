# cargo-nextest configuration.
#
# The differential/fuzz suites (`reference_conformance`, `iteration_fuzz`) run
# thousands of patterns per test, so the default per-test timeout is generous
# enough to distinguish "slow" from "hung" without failing an honest run.

[profile.default]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

# JUnit XML is what makes a red CI run readable without opening the log: the
# run summary lists the failing test names directly. Uploaded as an artifact by
# .github/workflows/test.yml.
[profile.default.junit]
path = "junit.xml"
